<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenidos — Datial + ElevenLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #06111a;
  --border:   rgba(255,255,255,0.07);
  --accent:   #00e5a0;
  --accent2:  #c084fc;
  --text:     #eef2f7;
  --muted:    #7a8fa3;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* BG ambient glows */
.bg-glow {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 50% at 10% 10%, rgba(0,229,160,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 55% 45% at 90% 85%, rgba(192,132,252,0.06) 0%, transparent 70%);
}

/* Decorative medical cross (left) */
.bg-cross {
  position: fixed; left: -50px; top: 16%; width: 190px; height: 190px;
  opacity: 0.05; pointer-events: none; z-index: 0; color: var(--accent);
}
/* Decorative pulse line (right) */
.bg-pulse {
  position: fixed; right: -30px; bottom: 20%; width: 220px; height: 90px;
  opacity: 0.06; pointer-events: none; z-index: 0; color: var(--accent2);
}

/* ── SCREEN ── */
.screen {
  position: relative; z-index: 5;
  min-height: 100vh;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 56px 48px 40px;
  max-width: 1180px;
  margin: 0 auto;
}

/* ── TOP BLOCK ── */
.top-block { padding-top: 48px; }

.welcome-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(3.2rem, 10vw, 7.5rem);
  font-weight: 800;
  line-height: 0.98;
  letter-spacing: -2px;
  color: var(--text);
  margin-bottom: 24px;
}

.welcome-sub {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: var(--muted);
  max-width: 560px;
  line-height: 1.6;
  margin-bottom: 28px;
}

.enter-link {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 0.95rem; font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  transition: gap 0.2s ease;
}
.enter-link:hover { gap: 14px; }
.enter-link svg { flex-shrink: 0; }

/* ── BOTTOM BLOCK ── */
.bottom-block { padding-bottom: 8px; }

.bottom-divider {
  width: 100%; height: 1px;
  background: var(--border);
  margin-bottom: 24px;
}

.bottom-logos {
  display: flex; align-items: center; gap: 16px;
}
.bl-datial { display: block; height: 24px; width: auto; }
.bl-sep { color: var(--muted); font-size: 1rem; }
.bl-eleven { display: block; height: 17px; width: auto; opacity: 0.92; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .screen { padding: 40px 20px 28px; }
  .top-block { padding-top: 24px; }
  .welcome-title { letter-spacing: -1px; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<svg class="bg-cross" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M32 6v20M32 38v20M6 32h20M38 32h20" />
</svg>
<svg class="bg-pulse" viewBox="0 0 220 90" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <polyline points="0 45 50 45 65 15 85 75 105 45 220 45" />
</svg>

<div class="screen">

  <!-- ── TOP BLOCK ── -->
  <div class="top-block">
    <h1 class="welcome-title">Bienvenidos</h1>
    <p class="welcome-sub">Evento exclusivo | Agentes de voz con IA para Salud</p>
    <a class="enter-link" href="/salud/agentes.html">
      Ingresar
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div>

  <!-- ── BOTTOM BLOCK ── -->
  <div class="bottom-block">
    <div class="bottom-divider"></div>
    <div class="bottom-logos">
      <img class="bl-datial" src="logo-datial.png" alt="Datial">
      <span class="bl-sep">+</span>
      <img class="bl-eleven" src="logo-elevenlabs.png" alt="ElevenLabs">
    </div>
  </div>

</div>

</body>
</html>
